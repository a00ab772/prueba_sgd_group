[project]
name = "prueba-sgd-group"
version = "0.1.0"
description = "Orquestación de proceso Spark en base a json de entrada"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=3.3.0",
    "apache-airflow-providers-amazon>=9.34.0",
    "boto3-stubs~=1.43.69",
    "delta-spark>=3.3.2",
    "moto>=5.2.2",
    "pandas>=2.0.0",
    "pyspark>=3.5,<4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "python-amazon-simple-product-api>=2.2.11",
]

[project.scripts]
prueba-sgd-group = "prueba_sgd_group:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
