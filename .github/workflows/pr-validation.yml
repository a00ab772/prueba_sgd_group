name: PR Validation (CI)

on:
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  code-quality:
    name: Verificar calidad de código y ejecutar los unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar UV y Python
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync

      - name: Run Linters
        run: uv run ruff check src/ dags/

      - name: Run Unit Tests
        run: uv run pytest tests/

  terraform-format:
    name: Verificar el formato de los archivos Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Verificación del formato Terraform
        run: terraform fmt -check -recursive terraform/

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init & Validate (${{ matrix.environment }})
        run: |
          cd terraform/environments/${{ matrix.environment }}
          terraform init -backend=false
          terraform validate
