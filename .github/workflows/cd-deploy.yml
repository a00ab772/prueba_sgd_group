name: Production Deployment (CD)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  quality-checks:
    name: Verificar calidad de código y ejecutar los unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalr UV y Python
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar Linters & Tests
        run: |
          uv sync
          uv run ruff check src/ dags/
          uv run pytest tests/

  deploy-infrastructure:
    name: Despliegue IaC (Terraform)
    needs: quality-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/prod
    outputs:
      s3_bucket_name: ${{ steps.tf_outputs.outputs.s3_bucket_name }}

    steps:
      - uses: actions/checkout@v4

      # Este rol permite actuar con la infraestructura de los siguientes componentes:
      # ► EC2 (VPC/subnets/NAT/SGs),
      # ► IAM (roles/policies/instance profiles),
      # ► MWAA (Airflow)
      # ► EMR
      # ► S3
      # ► DynamoDB
      # ► Secrets Manager
      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsProdRole
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        id: tf_outputs
        run: echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"

  deploy-artifacts:
    name: Desplegar código y DAGs en AWS
    needs: deploy-infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Autenticación con AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsProdRole
          aws-region: eu-central-1

      - name: Sync PySpark Jobs to S3
        run: |
          aws s3 sync ./src "s3://${{ needs.deploy-infrastructure.outputs.s3_bucket_name }}/scripts/" --delete

      - name: Sync Airflow DAGs to MWAA S3
        run: |
          aws s3 sync ./dags "s3://${{ needs.deploy-infrastructure.outputs.s3_bucket_name }}/dags/" --delete
